<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Krystal's Adventure</title>
<style>
  html,body{margin:0;height:100%;background:#0b0820;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 60px #0009}
</style>
</head>
<body>
<canvas id="c" width="960" height="544"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 544, T = 32, COLS = 230, ROWS = 17, ARENA_X0 = 200;
function fit(){ const s = Math.min(innerWidth/W, innerHeight/H); cv.style.width = W*s+'px'; cv.style.height = H*s+'px'; }
addEventListener('resize', fit); fit();

// ---------------- Input ----------------
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const K = {
  left:  () => keys.ArrowLeft || keys.KeyA,
  right: () => keys.ArrowRight || keys.KeyD,
  jump:  () => keys.Space || keys.ArrowUp || keys.KeyW || keys.KeyZ,
  down:  () => keys.ArrowDown || keys.KeyS,
};
const jp = c => pressed[c];
const jumpPressed  = () => jp('Space') || jp('ArrowUp') || jp('KeyW') || jp('KeyZ');
const throwPressed = () => jp('KeyX') || jp('KeyJ') || jp('KeyK');

// ---------------- Audio ----------------
let actx = null, muted = false;
function initAudio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  else if (actx.state === 'suspended') actx.resume();
}
function tone(f, d, type='square', vol=0.08, slide=0){
  if (!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f+slide), t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02);
}
function noise(d, vol=0.15){
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate*d), b = actx.createBuffer(1, n, actx.sampleRate), data = b.getChannelData(0);
  for (let i=0;i<n;i++) data[i] = (Math.random()*2-1)*(1-i/n);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(actx.destination); s.start();
}
const seq = (notes, gap, type='square', vol=0.06, d=0.1) => notes.forEach((f,i)=>setTimeout(()=>tone(f,d,type,vol),i*gap));
const SFX = {
  jump:  () => tone(330,0.15,'square',0.05,400),
  serve: () => tone(600,0.1,'triangle',0.1,-300),
  spike: () => { tone(900,0.18,'sawtooth',0.07,-700); noise(0.08,0.06); },
  hit:   () => { tone(200,0.08,'square',0.08,-100); noise(0.06,0.08); },
  boom:  () => { noise(0.4,0.2); tone(120,0.4,'sawtooth',0.08,-90); },
  star:  () => seq([880,1320],60,'square',0.04,0.08),
  hurt:  () => tone(240,0.3,'sawtooth',0.1,-160),
  catch: () => tone(500,0.05,'triangle',0.06),
  bounce:() => tone(250,0.05,'triangle',0.05),
  heart: () => seq([523,659,784],70,'square',0.05),
  check: () => seq([392,523,659,784],80,'triangle',0.08),
  win:   () => seq([523,659,784,1047,784,1047,1319],140,'square',0.06,0.18),
  zap:   () => tone(1200,0.12,'sawtooth',0.035,-900),
  lose:  () => seq([392,330,262,196],160,'triangle',0.08,0.2),
};
let musicStep = 0, musicTimer = 0;
function musicTick(){
  if (!actx || muted) return;
  if (--musicTimer > 0) return;
  const bossFight = arenaLock;
  musicTimer = bossFight ? 9 : 12;
  const bassA = [110,110,165,110,147,110,165,196], bassB = [98,98,147,98,131,98,147,175];
  const bass = (Math.floor(musicStep/16)%2 ? bassB : bassA)[musicStep%8];
  tone(bossFight ? bass*0.75 : bass, 0.16, 'triangle', 0.06);
  const mel = bossFight
    ? [330,0,311,0,330,0,392,0,330,0,311,0,262,0,247,0][musicStep%16]
    : [440,0,523,0,587,523,440,0,392,0,440,0,523,0,494,0, 440,0,523,0,659,587,523,0,587,0,523,0,440,0,0,0][musicStep%32];
  if (mel) tone(mel*2, 0.09, 'square', 0.018);
  musicStep++;
}

// ---------------- Helpers ----------------
function hash(a,b){ let h = (Math.imul(a,374761393) + Math.imul(b,668265263))|0; h = Math.imul(h^(h>>>13),1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
function circRect(cx,cy,r,e){ const nx = Math.max(e.x,Math.min(cx,e.x+e.w)), ny = Math.max(e.y,Math.min(cy,e.y+e.h)); return (cx-nx)**2+(cy-ny)**2 < r*r; }
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

// ---------------- Level ----------------
let map;
function buildLevel(){
  map = Array.from({length:ROWS}, () => Array(COLS).fill(' '));
  const fill = (x0,x1,y0,y1,c) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (x>=0&&x<COLS&&y>=0&&y<ROWS) map[y][x]=c; };
  fill(0,COLS-1,15,16,'#');
  for (const [a,b] of [[26,28],[46,49],[76,79],[115,118],[151,154]]) fill(a,b,15,16,' ');
  fill(10,14,11,11,'-');
  fill(34,38,12,14,'B'); fill(40,44,9,9,'-');
  fill(47,48,12,12,'-');
  fill(58,60,13,14,'B'); fill(61,63,11,14,'B');
  fill(81,83,12,14,'B'); fill(84,92,10,14,'B'); fill(94,98,7,7,'-'); fill(104,106,12,14,'B');
  fill(116,117,11,11,'-');
  fill(122,125,11,11,'-'); fill(127,130,8,8,'-'); fill(132,135,11,11,'-');
  fill(146,148,12,14,'B');
  fill(168,170,12,14,'B'); fill(180,186,12,12,'-');
  fill(204,207,11,11,'-'); fill(220,223,11,11,'-');
}
function solidAt(tx,ty){ if (tx<0||tx>=COLS) return true; if (ty<0||ty>=ROWS) return false; const c = map[ty][tx]; return c==='#'||c==='B'; }
function oneWayAt(tx,ty){ return tx>=0&&tx<COLS&&ty>=0&&ty<ROWS&&map[ty][tx]==='-'; }
function groundY(col){ for (let r=0;r<ROWS;r++) if (solidAt(col,r)||oneWayAt(col,r)) return r*T; return 15*T; }

const ENEMY_SPAWNS = [
  ['walker',18,14],['turret',36,11],['walker',42,14],['drone',55,7],['drone',66,6],['walker',68,14],['walker',72,14],
  ['walker',88,9],['turret',91,9],['drone',100,6],['walker',101,14],['drone',117,7],
  ['walker',123,10],['walker',140,14],['walker',144,14],['turret',147,11],
  ['drone',160,6],['walker',165,14],['turret',169,11],['drone',172,5],['walker',175,14],['drone',182,7],['walker',190,14],
];
const STARS = [[11,9],[12,8],[13,9],[20,12],[22,12],[24,12],[27,11],[36,9],[41,7],[42,7],[43,7],[47,10],[48,10],[55,12],[57,12],[62,9],
  [77,11],[78,10],[86,8],[88,8],[90,8],[95,5],[96,5],[97,5],[116,9],[117,9],[123,9],[128,6],[129,6],[133,9],
  [152,11],[153,10],[160,12],[162,12],[164,12],[181,10],[183,10],[185,10],[195,12]];
const HEARTS = [[64,8],[129,4],[183,9],[198,12]];
const CHECKS = [52,112,158,197];

// ---------------- Sprites ----------------
const PAL = {h:'#5a2d14',r:'#ffd23f',s:'#f5c6a0',e:'#1b1b2f',p:'#ff4f9a',n:'#23357a',w:'#ffffff',k:'#dfe3ff'};
const HEAD = [
  "....hhhhh...",
  "...hhhhhhh..",
  "..hrrrrrrrr.",
  ".hhhsssses..",
  "hhh.ssssss..",
  "hh..sssss...",
  "h....ss.....",
];
const BODY = ["...pppppp...","..sppppppps.","..s.pppp..s."];
const F_IDLE = HEAD.concat(BODY, ["....nnnn....","....nnnn....","....s..s....","....s..s....","....w..w....","....kk.kk..."]);
const F_RUN1 = HEAD.concat(BODY, ["....nnnn....","...nnnnnn...","...s....s...","..s......s..","..w......w..",".kk......kk."]);
const F_RUN2 = HEAD.concat(BODY, ["....nnnn....","....nnnn....",".....ss.....",".....ss.....",".....ww.....",".....kkk...."]);
const F_JUMP = HEAD.concat([".s.pppppp.s.",".s.pppppp.s.","....pppp....","....nnnn....","...nnnnnn...","..ss....ss..","..w......w..",".kk......kk.","............"]);
const F_THROW = HEAD.concat(["...pppppp...","..sppppppssss","..s.pppp....","....nnnn....","....nnnn....","....s..s....","....s..s....","....w..w....","....kk.kk..."]);
function makeSprite(rows, flip){
  const c = document.createElement('canvas'); c.width = 26; c.height = 32;
  const g = c.getContext('2d');
  rows.forEach((row,y) => [...row].forEach((ch,x) => {
    if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect((flip ? 12-x : x)*2+1, y*2, 2, 2); }
  }));
  return c;
}
const SPR = {};
for (const [k,f] of Object.entries({idle:F_IDLE,run1:F_RUN1,run2:F_RUN2,jump:F_JUMP,throw:F_THROW})) SPR[k] = [makeSprite(f,true), makeSprite(f,false)];

// ---------------- Background ----------------
const FAR = [], NEAR = [];
(() => {
  let s = 12345; const rng = () => (s = (s*16807)%2147483647)/2147483647;
  let x = -50; while (x < COLS*T*0.2+W) { const w = 50+rng()*80, h = 140+rng()*200; FAR.push({x,w,h}); x += w+rng()*8; }
  x = -50; let i = 0; while (x < COLS*T*0.45+W) { const w = 80+rng()*110, h = 110+rng()*230; NEAR.push({x,w,h,i:i++,ant:rng()<0.3}); x += w+12+rng()*30; }
})();

// ---------------- State ----------------
let state = 'title', player, enemies, stars, hearts, checks, bolts, parts, popups, ball, boss, trophy;
let cam = {x:0, shake:0}, score = 0, starCount = 0, lives = 3, checkpoint, arenaLock = false, frame = 0, deadTimer = 0, banner = null;

function makePlayer(x,y){ return {x,y,w:20,h:30,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,inv:90,hurtT:0,anim:0,throwAnim:0,dropT:0,hp:3,maxHp:5}; }
function makeEnemy(type,col,row){
  const e = {type,dead:false,flash:0,hitCd:0,vx:0,vy:0,t:Math.random()*100,face:-1,dir:-1,onGround:false};
  if (type==='walker'){ e.w=28; e.h=30; e.hp=2; }
  if (type==='drone'){ e.w=30; e.h=22; e.hp=1; }
  if (type==='turret'){ e.w=28; e.h=28; e.hp=3; e.cool=60+Math.random()*60; }
  if (type==='boss'){ e.w=64; e.h=80; e.hp=e.maxHp=16; e.cool=120; e.jumpT=170; e.active=false; }
  e.x = col*T+(T-e.w)/2; e.y = (row+1)*T-e.h; e.baseY = e.y;
  return e;
}
function newGame(){
  buildLevel();
  lives = 3; score = 0; starCount = 0; arenaLock = false; trophy = null; banner = null;
  enemies = ENEMY_SPAWNS.map(([t,c,r]) => makeEnemy(t,c,r));
  boss = makeEnemy('boss',222,14); enemies.push(boss);
  stars = STARS.map(([c,r]) => ({x:c*T+16,y:r*T+16,got:false}));
  hearts = HEARTS.map(([c,r]) => ({x:c*T+16,y:r*T+16,got:false}));
  checks = CHECKS.map(c => ({x:c*T, on:false}));
  checkpoint = {x:3*T, y:groundY(3)-30};
  bolts = []; parts = []; popups = []; ball = null;
  player = makePlayer(checkpoint.x, checkpoint.y);
  cam.x = 0; cam.shake = 0;
}
function respawn(){
  const hp = 3;
  player = makePlayer(checkpoint.x, checkpoint.y); player.hp = hp;
  ball = null; bolts = [];
  if (!boss.dead){ arenaLock = false; Object.assign(boss, makeEnemy('boss',222,14)); }
  cam.x = clamp(player.x - W*0.4, 0, COLS*T-W);
  state = 'play';
}

// ---------------- FX ----------------
function sparks(x,y,c,n){ for (let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.8)*6,life:18+Math.random()*14,c,s:3,g:0.25}); }
function explode(x,y,n){
  const cols = ['#ff5a1f','#ffd23f','#ffffff','#8a8fa3','#ff2e63'];
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, sp = Math.random()*7; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:25+Math.random()*30,c:cols[i%cols.length],s:3+Math.random()*5,g:0.12}); }
}
function dust(x,y){ for (let i=0;i<5;i++) parts.push({x:x+(Math.random()-.5)*14,y,vx:(Math.random()-.5)*2,vy:-Math.random()*1.2,life:15+Math.random()*10,c:'#d9cfe8',s:3,g:0}); }
function popup(x,y,text,c){ popups.push({x,y,text,c,life:55}); }
function updateFx(){
  for (const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.97; p.life--; }
  parts = parts.filter(p => p.life>0);
  for (const p of popups){ p.y-=0.8; p.life--; }
  popups = popups.filter(p => p.life>0);
  if (banner && --banner.life<=0) banner = null;
}

// ---------------- Physics ----------------
function moveEntity(e, noOneWay){
  e.hitWall = false;
  e.x += e.vx;
  let y0 = Math.floor(e.y/T), y1 = Math.floor((e.y+e.h-0.01)/T);
  if (e.vx>0){ const tx = Math.floor((e.x+e.w-0.01)/T); for (let ty=y0;ty<=y1;ty++) if (solidAt(tx,ty)){ e.x = tx*T-e.w; e.vx = 0; e.hitWall = true; break; } }
  else if (e.vx<0){ const tx = Math.floor(e.x/T); for (let ty=y0;ty<=y1;ty++) if (solidAt(tx,ty)){ e.x = (tx+1)*T; e.vx = 0; e.hitWall = true; break; } }
  const prevBottom = e.y+e.h;
  e.y += e.vy; e.onGround = false;
  const x0 = Math.floor(e.x/T), x1 = Math.floor((e.x+e.w-0.01)/T);
  if (e.vy>0){
    const ty = Math.floor((e.y+e.h-0.01)/T);
    for (let tx=x0;tx<=x1;tx++) if (solidAt(tx,ty) || (!noOneWay && oneWayAt(tx,ty) && prevBottom<=ty*T+0.5)){ e.y = ty*T-e.h; e.vy = 0; e.onGround = true; break; }
  } else if (e.vy<0){
    const ty = Math.floor(e.y/T);
    for (let tx=x0;tx<=x1;tx++) if (solidAt(tx,ty)){ e.y = (ty+1)*T; e.vy = 0; break; }
  }
}
function onOneWayOnly(p){
  const ty = Math.floor((p.y+p.h+1)/T), x0 = Math.floor(p.x/T), x1 = Math.floor((p.x+p.w-0.01)/T);
  let ow = false;
  for (let tx=x0;tx<=x1;tx++){ if (solidAt(tx,ty)) return false; if (oneWayAt(tx,ty)) ow = true; }
  return ow;
}

// ---------------- Player ----------------
function updatePlayer(){
  const p = player;
  const acc = p.onGround ? 0.6 : 0.42, max = 4.3, fr = p.onGround ? 0.72 : 0.94;
  let dir = (K.right()?1:0) - (K.left()?1:0);
  if (p.hurtT>0){ p.hurtT--; dir = 0; }
  if (dir){ p.vx += dir*acc; p.face = dir; if (Math.abs(p.vx)>max) p.vx = Math.sign(p.vx)*max; }
  else { p.vx *= fr; if (Math.abs(p.vx)<0.1) p.vx = 0; }

  if (p.onGround) p.coyote = 7; else if (p.coyote>0) p.coyote--;
  if (jumpPressed()) p.jbuf = 8; else if (p.jbuf>0) p.jbuf--;
  if (p.jbuf>0 && p.coyote>0){
    if (K.down() && p.onGround && onOneWayOnly(p)){ p.dropT = 14; p.y += 2; }
    else { p.vy = -11.2; SFX.jump(); dust(p.x+p.w/2, p.y+p.h); }
    p.jbuf = 0; p.coyote = 0;
  }
  if (!K.jump() && p.vy < -4) p.vy = -4;
  p.vy = Math.min(p.vy+0.55, 12);
  if (p.dropT>0) p.dropT--;
  const wasAir = !p.onGround;
  moveEntity(p, p.dropT>0);
  if (p.onGround && wasAir) dust(p.x+p.w/2, p.y+p.h);
  if (arenaLock && p.x < ARENA_X0*T){ p.x = ARENA_X0*T; p.vx = 0; }

  if (throwPressed() && !ball) throwBall();
  if (p.throwAnim>0) p.throwAnim--;
  if (p.inv>0) p.inv--;
  p.anim += Math.abs(p.vx)*0.06;
  if (p.y > ROWS*T+40) loseLife();
}
function throwBall(){
  const p = player;
  ball = {x:p.x+p.w/2+p.face*12, y:p.y+10, vx:0, vy:0, r:9, state:'out', t:0, spin:0, spike:false, bounces:0, trail:[]};
  if (!p.onGround){
    ball.vx = p.face*9; ball.vy = 7.5; ball.spike = true;
    SFX.spike(); popup(p.x+p.w/2, p.y-6, 'SPIKE!', '#ffd23f');
    if (p.vy > -2) p.vy = -2.5;
  } else {
    ball.vx = p.face*9 + p.vx*0.3; ball.vy = -5.5; SFX.serve();
  }
  p.throwAnim = 12;
}
function hurtPlayer(srcX){
  const p = player;
  if (p.inv>0 || state!=='play') return;
  p.hp--; p.inv = 90; p.hurtT = 14; p.vy = -6; p.vx = (p.x+p.w/2 < srcX ? -1 : 1)*4;
  SFX.hurt(); cam.shake = 8; sparks(p.x+p.w/2, p.y+p.h/2, '#ff4f9a', 10);
  if (p.hp<=0) loseLife();
}
function loseLife(){
  if (state!=='play') return;
  lives--; state = 'dead'; deadTimer = 100; SFX.lose();
  explode(player.x+player.w/2, Math.min(player.y, H-20)+player.h/2, 25);
  player.gone = true;
}

// ---------------- Ball ----------------
function ballSolid(x,y,ow){ const tx = Math.floor(x/T), ty = Math.floor(y/T); return solidAt(tx,ty) || (ow && oneWayAt(tx,ty)); }
function updateBall(){
  const b = ball; if (!b) return;
  b.t++; b.spin += b.vx*0.06;
  b.trail.push({x:b.x,y:b.y}); if (b.trail.length>6) b.trail.shift();
  const px = player.x+player.w/2, py = player.y+player.h/2;
  if (b.state==='out'){
    b.vy = Math.min(b.vy+0.38, 11);
    b.x += b.vx;
    if (ballSolid(b.x+Math.sign(b.vx)*b.r, b.y, false)){ b.x -= b.vx; b.vx *= -0.6; b.state = 'return'; SFX.bounce(); }
    const prevBottom = b.y + b.r;
    b.y += b.vy;
    if (b.vy>0 && (ballSolid(b.x,b.y+b.r,false) || (ballSolid(b.x,b.y+b.r,true) && Math.floor(prevBottom/T) < Math.floor((b.y+b.r)/T)))){
      b.y -= b.vy; b.vy *= -0.72; b.vx *= 0.9; b.bounces++; b.spike = false; SFX.bounce(); dust(b.x, b.y+b.r);
    } else if (b.vy<0 && ballSolid(b.x,b.y-b.r,false)){ b.y -= b.vy; b.vy *= -0.5; }
    if (b.t>75 || b.bounces>=3 || b.y>ROWS*T+40) b.state = 'return';
  } else {
    const dx = px-b.x, dy = py-b.y, d = Math.hypot(dx,dy)||1, sp = Math.min(14, 7+b.t*0.05);
    b.vx += (dx/d*sp-b.vx)*0.22; b.vy += (dy/d*sp-b.vy)*0.22;
    b.x += b.vx; b.y += b.vy;
  }
  const d = Math.hypot(px-b.x, py-b.y);
  if ((b.state==='return' && d<26) || (b.t>20 && d<18)){ ball = null; SFX.catch(); player.throwAnim = 6; return; }
  for (const e of enemies){
    if (e.dead || e.hitCd>0 || (e.type==='boss' && !e.active)) continue;
    if (circRect(b.x,b.y,b.r,e)){
      damage(e, b.spike?2:1);
      e.hitCd = 15;
      if (b.state==='out'){ b.vy = -6; b.vx = -b.vx*0.4; b.t = Math.max(b.t,62); b.spike = false; }
    }
  }
  for (const bo of bolts) if (!bo.dead && Math.hypot(bo.x-b.x, bo.y-b.y) < b.r+6){ bo.dead = true; sparks(bo.x,bo.y,'#7ff',6); score += 10; }
}

// ---------------- Enemies ----------------
function damage(e, n){
  e.hp -= n; e.flash = 8; SFX.hit();
  sparks(e.x+e.w/2, e.y+e.h/2, '#ffd23f', 8);
  if (e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true; SFX.boom();
  explode(e.x+e.w/2, e.y+e.h/2, e.type==='boss' ? 90 : 22);
  const pts = {walker:100, drone:150, turret:200, boss:5000}[e.type];
  score += pts; popup(e.x+e.w/2, e.y, '+'+pts, '#ffffff');
  cam.shake = Math.max(cam.shake, e.type==='boss' ? 30 : 6);
  if (e.type==='boss'){
    arenaLock = false; bolts = [];
    trophy = {x:226*T, y:15*T-48, w:32, h:48, t:0};
    banner = {text:'MEGA-BOT DEFEATED!', sub:'Grab the trophy!', life:180};
    for (let i=1;i<6;i++) setTimeout(() => { if (state==='play'){ explode(e.x+Math.random()*e.w, e.y+Math.random()*e.h, 30); SFX.boom(); cam.shake = 15; } }, i*180);
  }
}
function fireBolt(x,y,tx,ty,sp,angleOff=0){
  const a = Math.atan2(ty-y, tx-x) + angleOff;
  bolts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,r:5});
}
function updateEnemies(){
  const p = player, px = p.x+p.w/2, py = p.y+p.h/2;
  for (const e of enemies){
    if (e.dead) continue;
    if (e.flash>0) e.flash--; if (e.hitCd>0) e.hitCd--; e.t++;
    if (e.type!=='boss' && (e.x+e.w < cam.x-160 || e.x > cam.x+W+160)) continue;
    const ex = e.x+e.w/2, ey = e.y+e.h/2, dx = px-ex, dy = py-ey;
    if (e.type==='walker'){
      e.vy += 0.55; e.vx = e.dir*1.1;
      moveEntity(e);
      if (e.hitWall) e.dir *= -1;
      if (e.onGround){
        const fx = e.dir>0 ? e.x+e.w+2 : e.x-2, tx = Math.floor(fx/T), ty = Math.floor((e.y+e.h+2)/T);
        if (!solidAt(tx,ty) && !oneWayAt(tx,ty)) e.dir *= -1;
      }
      e.face = e.dir;
      if (e.y > ROWS*T) e.dead = true;
    } else if (e.type==='drone'){
      if (Math.abs(dx)<360){ e.vx += Math.sign(dx)*0.05; e.vx = clamp(e.vx,-1.7,1.7); } else e.vx *= 0.95;
      e.x += e.vx; e.y = e.baseY + Math.sin(e.t*0.05)*28;
      e.face = Math.sign(dx)||1;
    } else if (e.type==='turret'){
      e.face = Math.sign(dx)||1;
      if (Math.abs(dx)<440 && Math.abs(dy)<300){ if (--e.cool<=0){ fireBolt(ex, e.y+8, px, py, 4); SFX.zap(); e.cool = 120; } }
    } else if (e.type==='boss'){
      if (!e.active) continue;
      const rage = e.hp <= e.maxHp/2;
      e.vy += 0.6; e.face = Math.sign(dx)||1;
      if (e.onGround){
        e.vx = Math.abs(dx)>40 ? e.face*(rage?2.1:1.3) : 0;
        if (--e.jumpT<=0){ e.vy = -13; e.jumpT = rage ? 110 : 170; }
      }
      const wasAir = !e.onGround;
      moveEntity(e);
      e.x = clamp(e.x, ARENA_X0*T, COLS*T-e.w);
      if (e.onGround && wasAir && e.t>5){
        cam.shake = 12; SFX.boom(); dust(e.x+10,e.y+e.h); dust(e.x+e.w-10,e.y+e.h);
        bolts.push({x:e.x-4, y:e.y+e.h-8, vx:-5, vy:0, t:0, r:7, wave:true});
        bolts.push({x:e.x+e.w+4, y:e.y+e.h-8, vx:5, vy:0, t:0, r:7, wave:true});
      }
      if (--e.cool<=0){
        const offs = rage ? [-0.3,-0.15,0,0.15,0.3] : [-0.2,0,0.2];
        for (const o of offs) fireBolt(ex+e.face*20, e.y+24, px, py, 4.5, o);
        SFX.zap(); e.cool = rage ? 85 : 130;
      }
    }
  }
}
function updateBolts(){
  for (const b of bolts){
    b.x += b.vx; b.y += b.vy; b.t++;
    if (b.t>260 || solidAt(Math.floor(b.x/T), Math.floor(b.y/T))) b.dead = true;
    if (!b.dead && circRect(b.x,b.y,b.r,player)){ b.dead = true; hurtPlayer(b.x); }
  }
  bolts = bolts.filter(b => !b.dead);
}
function contacts(){
  const p = player;
  for (const e of enemies){
    if (e.dead || (e.type==='boss' && !e.active) || !overlap(p,e)) continue;
    const stomp = p.vy>0 && (p.y+p.h-p.vy) <= e.y+10;
    if (stomp){
      if (e.hitCd<=0){ damage(e, e.type==='boss'?1:2); e.hitCd = 12; score += 50; }
      p.vy = -9.5; p.coyote = 0; SFX.jump();
    } else hurtPlayer(e.x+e.w/2);
    if (state!=='play') return;
  }
}
function pickups(){
  const p = player, px = p.x+p.w/2, py = p.y+p.h/2;
  for (const s of stars) if (!s.got && Math.abs(s.x-px)<20 && Math.abs(s.y-py)<24){ s.got = true; starCount++; score += 50; SFX.star(); sparks(s.x,s.y,'#ffd23f',6); }
  for (const h of hearts) if (!h.got && Math.abs(h.x-px)<20 && Math.abs(h.y-py)<24){ h.got = true; p.hp = Math.min(p.maxHp, p.hp+1); SFX.heart(); popup(h.x,h.y-10,'+1 HEART','#ff4f9a'); }
  for (const c of checks) if (!c.on && px > c.x){
    c.on = true; checkpoint = {x:c.x, y:groundY(Math.floor(c.x/T))-30};
    SFX.check(); popup(c.x+16, 380, 'CHECKPOINT!', '#4ade80');
  }
  if (!boss.dead && !arenaLock && p.x > (ARENA_X0+4)*T){
    arenaLock = true; boss.active = true; boss.t = 0;
    banner = {text:'MEGA-BOT 9000', sub:'Serve it some volleyballs!', life:150};
    SFX.boom(); cam.shake = 10;
  }
  if (trophy && overlap(p, trophy)){
    state = 'win'; score += lives*1000 + starCount*20; SFX.win();
    for (let i=0;i<4;i++) explode(trophy.x+16, trophy.y, 20);
  }
}
function updateCam(){
  let target = player.x + player.w/2 - W*0.4 + player.face*40;
  const minX = arenaLock ? ARENA_X0*T : 0, maxX = COLS*T-W;
  target = clamp(target, minX, maxX);
  cam.x += (target-cam.x)*0.1;
  if (cam.shake>0){ cam.shake *= 0.9; if (cam.shake<0.5) cam.shake = 0; }
}

// ---------------- Step ----------------
function step(){
  frame++;
  if (jp('KeyM')) muted = !muted;
  if (state==='title'){
    cam.x = (frame*0.8) % (COLS*T-W);
    if (jp('Enter') || jp('Space')){ newGame(); state = 'play'; }
    return;
  }
  if (state==='gameover' || state==='win'){
    updateFx(); if (trophy) trophy.t++;
    if (jp('Enter')){ newGame(); state = 'title'; }
    return;
  }
  if (jp('KeyP') || jp('Escape')){ if (state==='play') state = 'paused'; else if (state==='paused') state = 'play'; }
  if (state==='paused') return;
  if (state==='dead'){
    updateFx();
    if (--deadTimer<=0){ if (lives>0) respawn(); else state = 'gameover'; }
    return;
  }
  updatePlayer();
  if (state==='play'){ updateBall(); updateEnemies(); updateBolts(); }
  if (state==='play') contacts();
  if (state==='play') pickups();
  updateFx(); updateCam(); musicTick();
  if (trophy) trophy.t++;
}

// ---------------- Render ----------------
function drawBG(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1d0b3f'); g.addColorStop(0.45,'#6b2a6e'); g.addColorStop(0.75,'#ee6f5c'); g.addColorStop(1,'#ffc27a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (let i=0;i<40;i++){ const x = (hash(i,1)*W*3 - cam.x*0.05)%W, y = hash(i,2)*200; ctx.fillStyle = `rgba(255,255,255,${0.3+0.5*hash(i,3)*Math.abs(Math.sin(frame*0.02+i))})`; ctx.fillRect((x+W)%W, y, 2, 2); }
  ctx.fillStyle = 'rgba(255,220,140,0.9)'; ctx.beginPath(); ctx.arc(W*0.72 - cam.x*0.02, 330, 80, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,140,0.25)'; ctx.beginPath(); ctx.arc(W*0.72 - cam.x*0.02, 330, 110, 0, Math.PI*2); ctx.fill();
  let off = cam.x*0.2;
  ctx.fillStyle = '#4a2466';
  for (const b of FAR){ const x = b.x-off; if (x+b.w<0||x>W) continue; ctx.fillRect(Math.round(x), 480-b.h, Math.ceil(b.w), b.h+64); }
  off = cam.x*0.45;
  for (const b of NEAR){
    const x = Math.round(b.x-off); if (x+b.w<0||x>W) continue;
    const top = 480-b.h;
    ctx.fillStyle = '#24123d'; ctx.fillRect(x, top, Math.ceil(b.w), b.h+64);
    if (b.ant){ ctx.fillRect(x+b.w/2-1, top-30, 3, 30); ctx.fillStyle = frame%60<30 ? '#ff3355' : '#661122'; ctx.fillRect(x+b.w/2-2, top-33, 5, 5); }
    let row = 0;
    for (let wy = top+14; wy < 470; wy += 22, row++){
      let col = 0;
      for (let wx = x+10; wx < x+b.w-14; wx += 18, col++){
        ctx.fillStyle = hash(b.i*31+col, row) < 0.32 ? '#ffd36b' : '#33204f';
        ctx.fillRect(wx, wy, 8, 11);
      }
    }
  }
}
function drawTiles(){
  const c0 = Math.max(0, Math.floor(cam.x/T)-1), c1 = Math.min(COLS-1, Math.floor((cam.x+W)/T)+1);
  for (let ty=0;ty<ROWS;ty++) for (let tx=c0;tx<=c1;tx++){
    const c = map[ty][tx]; if (c===' ') continue;
    const x = tx*T, y = ty*T;
    if (c==='#'){
      const top = ty===0 || map[ty-1][tx]!=='#';
      if (top){
        ctx.fillStyle = '#9a96ad'; ctx.fillRect(x,y,T,10);
        ctx.fillStyle = '#c4c0d4'; ctx.fillRect(x,y,T,2);
        ctx.fillStyle = '#6e6a82'; ctx.fillRect(x,y+10,T,3); ctx.fillRect(x+T-1,y,1,10);
        ctx.fillStyle = '#34303f'; ctx.fillRect(x,y+13,T,T-13);
        if (tx%4===0){ ctx.fillStyle = '#e8c547'; ctx.fillRect(x+4,y+22,16,3); }
      } else {
        ctx.fillStyle = '#2a2634'; ctx.fillRect(x,y,T,T);
        ctx.fillStyle = '#3a3546'; if (hash(tx,ty)<0.5) ctx.fillRect(x+hash(tx,ty+9)*26, y+hash(tx+3,ty)*26, 4, 3);
      }
    } else if (c==='B'){
      ctx.fillStyle = '#9c4232'; ctx.fillRect(x,y,T,T);
      ctx.fillStyle = '#6d2c22';
      for (let r=0;r<4;r++){ ctx.fillRect(x, y+r*8+7, T, 1); const o = (r%2)*8; ctx.fillRect(x+o, y+r*8, 1, 8); ctx.fillRect(x+o+16, y+r*8, 1, 8); }
      if (ty===0 || map[ty-1][tx]!=='B'){ ctx.fillStyle = '#d6cfc2'; ctx.fillRect(x-1,y,T+2,6); ctx.fillStyle = '#9d968a'; ctx.fillRect(x-1,y+5,T+2,2); }
    } else if (c==='-'){
      ctx.fillStyle = '#4a5266'; ctx.fillRect(x,y,T,7);
      ctx.fillStyle = '#7d89a8'; ctx.fillRect(x,y,T,2);
      ctx.fillStyle = '#2e3445'; for (let i=3;i<T;i+=6) ctx.fillRect(x+i,y+3,2,3);
      ctx.fillStyle = '#4a5266';
      if (!oneWayAt(tx-1,ty)) { ctx.fillRect(x,y+7,3,14); ctx.fillRect(x,y+18,10,3); }
      if (!oneWayAt(tx+1,ty)) { ctx.fillRect(x+T-3,y+7,3,14); ctx.fillRect(x+T-10,y+18,10,3); }
    }
  }
}
function drawStar(x,y,r,rot){
  ctx.beginPath();
  for (let i=0;i<10;i++){ const a = rot + i*Math.PI/5 - Math.PI/2, rr = i%2 ? r*0.45 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill();
}
function drawHeart(x,y,s,fill){
  const px = [" xx xx ","xxxxxxx","xxxxxxx"," xxxxx ","  xxx  ","   x   "];
  px.forEach((row,j) => [...row].forEach((ch,i) => { if (ch==='x'){ ctx.fillStyle = fill ? (j<2&&i<3&&i>0 ? '#ff9ec7' : '#ff2e63') : '#3a2a4a'; ctx.fillRect(x+i*s, y+j*s, s, s); } }));
}
function drawVolleyball(x,y,r,spin){
  ctx.save(); ctx.translate(x,y); ctx.rotate(spin);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ffcc1f'; ctx.beginPath(); ctx.arc(-r*0.9,0,r,-0.9,0.9); ctx.stroke();
  ctx.strokeStyle = '#2b6cff'; ctx.beginPath(); ctx.arc(r*0.45,-r*0.8,r,1.3,2.9); ctx.stroke();
  ctx.strokeStyle = '#ffcc1f'; ctx.beginPath(); ctx.arc(r*0.45,r*0.8,r,3.4,5.0); ctx.stroke();
  ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawEnemy(e){
  const fl = e.flash>0 && e.flash%2===0;
  const metal = fl ? '#ffffff' : '#9aa3b5', dark = fl ? '#ffffff' : '#4b5163', eye = '#ff2e4d';
  const x = Math.round(e.x), y = Math.round(e.y);
  if (e.type==='walker'){
    const step = Math.floor(e.t/8)%2;
    ctx.fillStyle = dark; ctx.fillRect(x+5, y+22, 6, 8-step*2); ctx.fillRect(x+17, y+22, 6, 6+step*2);
    ctx.fillStyle = metal; ctx.fillRect(x+2, y+6, 24, 17);
    ctx.fillStyle = dark; ctx.fillRect(x+2, y+6, 24, 3);
    ctx.fillStyle = '#1b1b2f'; ctx.fillRect(x+4, y+10, 20, 7);
    ctx.fillStyle = eye; ctx.fillRect(x+(e.face>0?15:5), y+11, 8, 5);
    ctx.fillStyle = dark; ctx.fillRect(x+13, y, 2, 6);
    ctx.fillStyle = e.t%40<20 ? '#ffd23f' : '#7a5b00'; ctx.fillRect(x+12, y-2, 4, 4);
    ctx.fillStyle = dark; ctx.fillRect(x+(e.face>0?-3:25), y+13, 6, 4);
  } else if (e.type==='drone'){
    ctx.fillStyle = dark; ctx.fillRect(x+14, y-4, 2, 6);
    const pw = Math.abs(Math.sin(e.t*0.6))*26+4; ctx.fillStyle = '#c8d0e0'; ctx.fillRect(x+15-pw/2, y-6, pw, 2);
    ctx.fillStyle = metal; ctx.beginPath(); ctx.ellipse(x+15, y+11, 15, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1b1b2f'; ctx.fillRect(x+5, y+7, 20, 7);
    ctx.fillStyle = eye; ctx.fillRect(x+(e.face>0?16:7), y+8, 7, 5);
    ctx.fillStyle = dark; ctx.fillRect(x+6, y+19, 3, 5); ctx.fillRect(x+21, y+19, 3, 5);
  } else if (e.type==='turret'){
    const a = Math.atan2(player.y+15-(y+8), player.x+10-(x+14));
    ctx.save(); ctx.translate(x+14, y+10); ctx.rotate(a); ctx.fillStyle = dark; ctx.fillRect(0,-3,20,6); ctx.restore();
    ctx.fillStyle = metal; ctx.beginPath(); ctx.arc(x+14, y+14, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dark; ctx.fillRect(x, y+14, 28, 14);
    ctx.fillStyle = '#e8c547'; for (let i=0;i<4;i++) ctx.fillRect(x+2+i*7, y+20, 4, 4);
    ctx.fillStyle = e.cool<30 && e.t%6<3 ? '#ffffff' : eye; ctx.fillRect(x+11, y+6, 6, 4);
  } else if (e.type==='boss'){
    const rage = e.hp <= e.maxHp/2;
    const body = fl ? '#ffffff' : (rage ? '#a85a5a' : '#7a8296'), bd = fl ? '#ffffff' : '#3b4050';
    const step = e.onGround ? Math.floor(e.t/10)%2 : 0;
    ctx.fillStyle = bd; ctx.fillRect(x+8, y+60, 18, 20-step*3); ctx.fillRect(x+38, y+60, 18, 17+step*3);
    ctx.fillStyle = body; ctx.fillRect(x+2, y+18, 60, 44);
    ctx.fillStyle = bd; ctx.fillRect(x+2, y+18, 60, 4); ctx.fillRect(x+12, y+34, 40, 20);
    ctx.fillStyle = e.t%30<15 ? '#ffd23f' : '#ff7a1f'; ctx.fillRect(x+26, y+38, 12, 12);
    ctx.fillStyle = body; ctx.fillRect(x+12, y, 40, 20);
    ctx.fillStyle = '#1b1b2f'; ctx.fillRect(x+15, y+5, 34, 10);
    ctx.fillStyle = eye; ctx.fillRect(x+(e.face>0?32:17), y+7, 6, 6); ctx.fillRect(x+(e.face>0?41:26), y+7, 6, 6);
    ctx.fillStyle = '#1b1b2f'; ctx.fillRect(x+(e.face>0?30:15), y+4, 10, 2); ctx.fillRect(x+(e.face>0?40:25), y+4, 10, 2);
    ctx.fillStyle = bd; const arm = Math.sin(e.t*0.1)*4;
    ctx.fillRect(x-8, y+22+arm, 10, 28); ctx.fillRect(x+62, y+22-arm, 10, 28);
    ctx.fillStyle = body; ctx.fillRect(x-10, y+48+arm, 14, 10); ctx.fillRect(x+60, y+48-arm, 14, 10);
    ctx.fillStyle = bd; ctx.fillRect(x+30, y-12, 4, 12); ctx.fillStyle = '#ff2e4d'; ctx.fillRect(x+28, y-16, 8, 6);
  }
}
function drawPlayer(){
  const p = player;
  if (p.gone) return;
  if (p.inv>0 && Math.floor(p.inv/4)%2 && state==='play') return;
  let f = 'idle';
  if (p.throwAnim>0) f = 'throw';
  else if (!p.onGround) f = 'jump';
  else if (Math.abs(p.vx)>0.5) f = Math.floor(p.anim)%2 ? 'run1' : 'run2';
  const img = SPR[f][p.face>0 ? 1 : 0];
  const x = Math.round(p.x-3), y = Math.round(p.y-2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; if (p.onGround) ctx.fillRect(x+4, p.y+p.h, 18, 3);
  ctx.drawImage(img, x, y);
  if (!ball){ // carrying the volleyball at her hip
    const bx = p.x+p.w/2 - p.face*4, by = p.y+19;
    if (p.throwAnim<=0) drawVolleyball(bx + p.face*-2, by, 6, 0);
  }
}
function drawWorld(){
  const sx = cam.shake ? (Math.random()-.5)*cam.shake : 0, sy = cam.shake ? (Math.random()-.5)*cam.shake : 0;
  ctx.save(); ctx.translate(Math.round(-cam.x+sx), Math.round(sy));
  // checkpoints (lampposts)
  for (const c of checks){
    const gy = groundY(Math.floor(c.x/T));
    ctx.fillStyle = '#2b2f3d'; ctx.fillRect(c.x+14, gy-96, 4, 96); ctx.fillRect(c.x+10, gy-6, 12, 6);
    ctx.fillRect(c.x+14, gy-96, 14, 3);
    ctx.fillStyle = c.on ? '#fff3a8' : '#5c5c70'; ctx.fillRect(c.x+24, gy-93, 6, 6);
    if (c.on){ ctx.fillStyle = 'rgba(255,240,160,0.15)'; ctx.beginPath(); ctx.moveTo(c.x+27,gy-90); ctx.lineTo(c.x+5,gy); ctx.lineTo(c.x+50,gy); ctx.fill(); }
    ctx.fillStyle = c.on ? '#4ade80' : '#8a8a9a';
    const wv = Math.sin(frame*0.1)*2;

  }

  drawTiles();
  // pickups
  for (const s of stars) if (!s.got){ ctx.fillStyle = '#ffd23f'; drawStar(s.x, s.y+Math.sin(frame*0.08+s.x)*3, 9, frame*0.03); ctx.fillStyle = '#fff6c2'; drawStar(s.x, s.y+Math.sin(frame*0.08+s.x)*3, 4, frame*0.03); }
  for (const h of hearts) if (!h.got) drawHeart(h.x-10, h.y-8+Math.sin(frame*0.1)*3, 3, true);
  if (trophy){
    const x = trophy.x, y = trophy.y, glow = 0.3+Math.sin(trophy.t*0.1)*0.15;
    ctx.fillStyle = `rgba(255,210,63,${glow})`; ctx.beginPath(); ctx.arc(x+16, y+18, 34, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffcc1f'; ctx.fillRect(x+4, y+10, 24, 18); ctx.fillRect(x, y+12, 4, 10); ctx.fillRect(x+28, y+12, 4, 10);
    ctx.fillRect(x+13, y+28, 6, 10); ctx.fillRect(x+6, y+38, 20, 10);
    ctx.fillStyle = '#fff1a0'; ctx.fillRect(x+7, y+12, 4, 12);
    drawVolleyball(x+16, y+2+Math.sin(trophy.t*0.08)*3, 8, trophy.t*0.05);
  }
  for (const e of enemies) if (!e.dead) drawEnemy(e);
  for (const b of bolts){
    if (b.wave){ ctx.fillStyle = '#ffb02e'; ctx.fillRect(b.x-8, b.y-6, 16, 14); ctx.fillStyle = '#fff3c2'; ctx.fillRect(b.x-4, b.y-3, 8, 8); }
    else { ctx.fillStyle = '#5ff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r-2,0,Math.PI*2); ctx.fill(); }
  }
  drawPlayer();
  if (ball){
    if (ball.spike) ball.trail.forEach((t,i) => { ctx.fillStyle = `rgba(255,150,40,${i/12})`; ctx.beginPath(); ctx.arc(t.x,t.y,ball.r*(0.5+i/12),0,Math.PI*2); ctx.fill(); });
    drawVolleyball(ball.x, ball.y, ball.r, ball.spin);
  }
  for (const p of parts){ ctx.globalAlpha = Math.min(1, p.life/15); ctx.fillStyle = p.c; ctx.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 16px Menlo, monospace';
  for (const p of popups){ ctx.globalAlpha = Math.min(1, p.life/20); outlined(p.text, p.x, p.y, p.c, 3); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function outlined(text,x,y,c,lw=4){ ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = '#1b0f2e'; ctx.strokeText(text,x,y); ctx.fillStyle = c; ctx.fillText(text,x,y); }
function drawHUD(){
  for (let i=0;i<Math.max(3,player.maxHp);i++) if (i<3 || i<player.hp) drawHeart(16+i*26, 14, 3, i<player.hp);
  ctx.textAlign = 'left'; ctx.font = 'bold 18px Menlo, monospace';
  ctx.fillStyle = '#ffd23f'; drawStar(26, 52, 9, 0);
  outlined('x'+starCount, 40, 58, '#ffffff', 4);
  outlined('KRYSTAL x'+Math.max(0,lives), 16, 84, '#ff9ec7', 4);
  ctx.textAlign = 'right'; outlined('SCORE '+String(score).padStart(6,'0'), W-16, 30, '#ffffff', 4);
  if (muted){ ctx.font = 'bold 12px Menlo, monospace'; outlined('MUTED (M)', W-16, 50, '#aaa', 3); }
  if (arenaLock && !boss.dead){
    const bw = 400, bx = (W-bw)/2, by = 18;
    ctx.fillStyle = '#1b0f2e'; ctx.fillRect(bx-4, by-4, bw+8, 22);
    ctx.fillStyle = '#4a1020'; ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = boss.hp <= boss.maxHp/2 ? '#ff2e4d' : '#ff7a1f'; ctx.fillRect(bx, by, bw*Math.max(0,boss.hp)/boss.maxHp, 14);
    ctx.textAlign = 'center'; ctx.font = 'bold 12px Menlo, monospace'; outlined('MEGA-BOT 9000', W/2, by+11, '#fff', 3);
  }
  if (banner){
    ctx.globalAlpha = Math.min(1, banner.life/30);
    ctx.textAlign = 'center'; ctx.font = 'bold 40px Menlo, monospace'; outlined(banner.text, W/2, 170, '#ffd23f', 8);
    ctx.font = 'bold 18px Menlo, monospace'; outlined(banner.sub, W/2, 200, '#ffffff', 5);
    ctx.globalAlpha = 1;
  }
}
function dim(a=0.55){ ctx.fillStyle = `rgba(14,6,30,${a})`; ctx.fillRect(0,0,W,H); }
function drawTitle(){
  dim(0.45);
  ctx.textAlign = 'center';
  const bob = Math.sin(frame*0.05)*6;
  ctx.font = 'bold 64px Menlo, monospace'; outlined("KRYSTAL'S", W/2, 130+bob, '#ff4f9a', 10);
  ctx.font = 'bold 64px Menlo, monospace'; outlined('ADVENTURE', W/2, 200+bob, '#ffd23f', 10);
  ctx.save(); ctx.translate(W/2-26, 236); ctx.scale(2,2); ctx.drawImage(SPR[Math.floor(frame/10)%2?'run1':'run2'][1], 0, 0); ctx.restore();
  drawVolleyball(W/2+40, 270+Math.abs(Math.sin(frame*0.08))*-30, 12, frame*0.1);
  ctx.font = 'bold 16px Menlo, monospace';
  const lines = [
    ['←/→ or A/D', 'run'], ['SPACE / W / ↑', 'jump (hold for higher)'], ['X / J', 'serve the volleyball'],
    ['X while in the air', 'SPIKE! (double damage)'], ['jump on robots', 'stomp'], ['↓ + jump', 'drop through fire escapes'], ['P / M', 'pause / mute'],
  ];
  lines.forEach(([k,v],i) => { ctx.textAlign = 'right'; outlined(k, W/2-10, 345+i*22, '#9fe8ff', 4); ctx.textAlign = 'left'; outlined(v, W/2+10, 345+i*22, '#ffffff', 4); });
  ctx.textAlign = 'center'; ctx.font = 'bold 22px Menlo, monospace';
  if (Math.floor(frame/30)%2) outlined('PRESS ENTER TO START', W/2, 520, '#ffd23f', 6);
}
function render(){
  drawBG();
  drawWorld();
  if (state==='title'){ drawTitle(); return; }
  drawHUD();
  ctx.textAlign = 'center';
  if (state==='paused'){ dim(); ctx.font = 'bold 48px Menlo, monospace'; outlined('PAUSED', W/2, H/2, '#ffd23f', 8); ctx.font = 'bold 18px Menlo, monospace'; outlined('press P to keep spiking', W/2, H/2+36, '#fff', 4); }
  if (state==='dead' && lives>0){ ctx.font = 'bold 36px Menlo, monospace'; outlined('OUCH!', W/2, H/2-20, '#ff4f9a', 8); ctx.font = 'bold 18px Menlo, monospace'; outlined(lives+(lives===1?' life':' lives')+' left', W/2, H/2+14, '#fff', 4); }
  if (state==='gameover'){ dim(0.7); ctx.font = 'bold 56px Menlo, monospace'; outlined('GAME OVER', W/2, H/2-20, '#ff2e4d', 10); ctx.font = 'bold 20px Menlo, monospace'; outlined('The robots win this round... score '+score, W/2, H/2+20, '#fff', 5); outlined('Press ENTER', W/2, H/2+56, '#ffd23f', 5); }
  if (state==='win'){
    dim(0.6); ctx.font = 'bold 52px Menlo, monospace'; outlined('YOU SAVED THE CITY!', W/2, H/2-50, '#ffd23f', 10);
    ctx.font = 'bold 22px Menlo, monospace';
    outlined("Krystal spiked every last robot.", W/2, H/2-6, '#ff9ec7', 5);
    outlined('Final score: '+score+'   Stars: '+starCount+'/'+STARS.length, W/2, H/2+30, '#ffffff', 5);
    outlined('Press ENTER to play again', W/2, H/2+70, '#9fe8ff', 5);
  }
}

// ---------------- Loop ----------------
newGame();
if (location.hash==='#play'){ state = 'play'; }
if (location.hash==='#boss'){ state = 'play'; checkpoint = {x:197*T, y:groundY(197)-30}; respawn(); }
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now-last); last = now;
  while (acc >= 1000/60){ step(); acc -= 1000/60; for (const k in pressed) delete pressed[k]; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
